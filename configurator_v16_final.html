<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joy Factory aXtion Configurator v15</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{--color-background-primary:#fff;--color-background-secondary:#f5f5f4;--color-border-tertiary:#e7e5e4;--color-border-secondary:#d6d3d1;--color-text-primary:#1c1917;--color-text-secondary:#57534e;--color-text-tertiary:#a8a29e;--font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--font-mono:'SF Mono','Fira Code',monospace;--border-radius-md:8px;--border-radius-lg:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:#f5f5f4;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px}
.outer{width:100%;max-width:750px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.step-nav{display:flex;gap:6px;align-items:center;flex:1;flex-wrap:wrap}
.snav-item{display:flex;align-items:center;gap:6px}
.snav-dot{width:26px;height:26px;border-radius:50%;border:0.5px solid var(--color-border-secondary);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:var(--color-text-secondary);background:var(--color-background-primary)}
.snav-dot.done{background:#c8291c;border-color:#c8291c;color:#fff}
.snav-dot.active{background:#c8291c;border-color:#c8291c;color:#fff;box-shadow:0 0 0 3px rgba(200,41,28,.15)}
.snav-label{font-size:10px;color:var(--color-text-tertiary)}
.snav-label.active{color:var(--color-text-primary);font-weight:500}
.snav-line{flex:1;height:0.5px;background:var(--color-border-tertiary);min-width:8px}
.snav-line.done{background:#c8291c}
.btn-reset{display:flex;align-items:center;gap:5px;background:transparent;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:5px 12px;font-size:11px;cursor:pointer;color:var(--color-text-secondary);white-space:nowrap;flex-shrink:0;margin-left:12px}
.btn-reset:hover{background:var(--color-background-secondary)}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.card-header{padding:16px 20px 14px;border-bottom:0.5px solid var(--color-border-tertiary)}
.prog-bar{height:3px;background:var(--color-background-secondary);border-radius:99px;margin-bottom:12px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;background:#c8291c;transition:width .3s}
.step-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.step-label{font-size:11px;color:var(--color-text-tertiary)}
.step-pct{font-size:11px;color:#c8291c;font-weight:500}
.step-q{font-size:17px;font-weight:500;color:var(--color-text-primary);margin:0 0 4px}
.step-sub{font-size:12px;color:var(--color-text-secondary)}
.card-body{padding:14px 20px}
.nav-row{display:flex;flex-direction:column;gap:6px;padding:12px 20px;border-top:0.5px solid var(--color-border-tertiary)}
.nav-row-btns{display:flex;justify-content:space-between;align-items:center}
.btn-back{background:transparent;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:7px 16px;font-size:12px;cursor:pointer;color:var(--color-text-secondary)}
.btn-back:disabled{opacity:.35;cursor:not-allowed}
.btn-next{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:9px 22px;font-size:12px;font-weight:500;color:var(--color-text-tertiary);cursor:not-allowed;transition:all .15s}
.btn-next.enabled{background:#c8291c;border-color:#c8291c;color:#fff;cursor:pointer;box-shadow:0 0 0 3px rgba(200,41,28,.12)}
.next-hint{font-size:10px;color:var(--color-text-tertiary);text-align:right;min-height:14px}
.next-hint.show{color:#c8291c;font-weight:500}
.logic-note{font-size:10px;color:var(--color-text-tertiary);background:var(--color-background-secondary);padding:6px 10px;border-left:2px solid var(--color-border-secondary);margin-top:10px}
.breadcrumb{font-size:11px;color:var(--color-text-tertiary);margin-bottom:10px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.bc-item{color:#c8291c}.bc-sep{color:var(--color-border-secondary)}
.device-table{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.device-group-head{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--color-background-secondary);font-size:11px;font-weight:600;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;border-top:0.5px solid var(--color-border-tertiary);cursor:pointer;user-select:none;transition:background .15s}
.device-group-head:first-child{border-top:none}
.device-group-head:hover{background:var(--color-border-tertiary)}
.device-group-head.open{background:#fff0ef;color:#993C1D;border-left:2px solid #c8291c}
.device-group-left{display:flex;align-items:center;gap:7px}
.device-group-count{font-size:9px;font-weight:400;color:var(--color-text-tertiary);text-transform:none;letter-spacing:0;margin-left:4px}
.device-group-chevron{font-size:13px;color:var(--color-text-tertiary);transition:transform .2s;flex-shrink:0}
.device-rows-wrap{overflow:hidden;max-height:0;transition:max-height .25s ease}
.device-rows-wrap.open{max-height:800px}
.device-row{display:flex;align-items:center;gap:9px;padding:7px 14px 7px 28px;cursor:pointer;border-top:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary)}
.device-row:hover{background:#fff8f8}
.device-icon{width:22px;height:22px;border-radius:var(--border-radius-md);background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:center;color:var(--color-text-tertiary);font-size:11px;flex-shrink:0}
.device-name{font-size:12px;font-weight:500;color:var(--color-text-primary);flex:1}
.device-arrow{color:var(--color-border-secondary);font-size:11px;flex-shrink:0}
.gate-block{padding:4px 0 16px}
.gate-q{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:10px}
.gate-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gate-opt{display:flex;align-items:center;gap:9px;padding:11px 14px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);cursor:pointer;background:var(--color-background-primary)}
.gate-opt:hover{background:var(--color-background-secondary)}
.gate-icon{width:30px;height:30px;border-radius:var(--border-radius-md);background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:center;color:var(--color-text-secondary);font-size:14px;flex-shrink:0}
.gate-text{font-size:12px;font-weight:500;color:var(--color-text-primary)}
.gate-sub{font-size:10px;color:var(--color-text-tertiary)}
.device-filter-note{background:#fff8f8;border:0.5px solid #f09595;border-radius:var(--border-radius-md);padding:7px 10px;font-size:10px;color:#993C1D;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.feat-section-label{font-size:11px;font-weight:600;color:var(--color-text-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.feat-table{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.feat-row{display:flex;align-items:center;gap:10px;padding:6px 12px;cursor:pointer;border-top:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary)}
.feat-row:first-child{border-top:none}
.feat-row:hover{background:var(--color-background-secondary)}
.feat-row.selected{background:#fff8f8}
.feat-check{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--color-border-secondary);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px}
.feat-row.selected .feat-check{background:#c8291c;border-color:#c8291c;color:#fff}
.feat-title{font-size:12px;font-weight:500;color:var(--color-text-primary);flex-shrink:0;white-space:nowrap}
.feat-desc{font-size:10px;color:var(--color-text-tertiary);text-align:right;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:10px}
.certified-change{font-size:10px;color:var(--color-text-tertiary);margin-bottom:10px;display:flex;align-items:center;gap:5px}
.certified-change a{color:#c8291c;cursor:pointer;text-decoration:none;font-weight:500}
.env-device-badge{display:inline-flex;align-items:center;gap:5px;background:#fff0ef;border:0.5px solid #f09595;border-radius:99px;padding:4px 10px;font-size:10px;color:#993C1D;font-weight:500;margin-bottom:10px}
.env-table{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;margin-bottom:4px}
.env-row{display:flex;align-items:center;gap:12px;padding:9px 14px;border-top:0.5px solid var(--color-border-tertiary);flex-wrap:wrap}
.env-row:first-child{border-top:none}
.env-q-wrap{flex:1;min-width:180px}
.env-q{font-size:12px;font-weight:500;color:var(--color-text-primary);margin-bottom:1px}
.env-q-hint{font-size:10px;color:var(--color-text-tertiary)}
.env-choices{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.env-choice{padding:5px 11px;border:0.5px solid var(--color-border-tertiary);border-radius:99px;font-size:11px;color:var(--color-text-secondary);cursor:pointer;background:var(--color-background-primary);white-space:nowrap}
.env-choice:hover{background:var(--color-background-secondary)}
.env-choice.selected{background:#c8291c;border-color:#c8291c;color:#fff;font-weight:500}
.env-progress{font-size:10px;color:var(--color-text-tertiary);margin-bottom:8px;text-align:right}
.review-wrap{padding:14px 20px}
.bundle-tab-row{display:flex;width:100%;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);overflow:hidden;margin-bottom:14px}
.bundle-tab{flex:1;padding:8px 10px;font-size:12px;font-weight:500;color:var(--color-text-secondary);background:var(--color-background-secondary);cursor:pointer;border:none;overflow:hidden;text-overflow:ellipsis;transition:background .12s,color .12s;border-right:0.5px solid var(--color-border-secondary);text-align:center}
.bundle-tab:last-child{border-right:none}
.bundle-tab:hover{background:var(--color-background-primary);color:var(--color-text-primary)}
.bundle-tab.active{background:#c8291c;color:#fff;cursor:default}
.confirm-section-label{font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:8px}
.confirm-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:0.5px solid var(--color-border-tertiary);transition:background .4s}
.confirm-item:last-of-type{border-bottom:none}
.confirm-item.zeroed{opacity:.45}
.confirm-item-img{width:40px;height:40px;border-radius:var(--border-radius-md);background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--color-text-tertiary);flex-shrink:0}
.confirm-item-info{flex:1;min-width:0}
.confirm-item-type{font-size:9px;color:var(--color-text-tertiary);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.confirm-item-name{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.confirm-item-sku{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-mono)}
.confirm-item-unit{font-size:10px;color:var(--color-text-secondary);margin-top:1px}
.qty-ctrl{display:flex;align-items:center;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);overflow:hidden;flex-shrink:0}
.qty-btn{width:30px;height:30px;border:none;background:var(--color-background-secondary);cursor:pointer;font-size:15px;color:var(--color-text-primary);display:flex;align-items:center;justify-content:center}
.qty-btn:hover{background:var(--color-background-primary)}
.qty-val{width:32px;text-align:center;font-size:13px;font-weight:500;color:var(--color-text-primary);border:none;border-left:0.5px solid var(--color-border-tertiary);border-right:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);padding:0;line-height:30px}
.confirm-item-subtotal{font-size:13px;font-weight:500;color:var(--color-text-primary);min-width:48px;text-align:right;flex-shrink:0}
.bundle-total-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0 0;border-top:0.5px solid var(--color-border-tertiary);margin-top:4px}
.bundle-total-label{font-size:12px;color:var(--color-text-secondary)}
.bundle-total-price{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.bundle-total-items{font-size:10px;color:var(--color-text-tertiary);margin-top:1px}
.ai-agent-box{border:0.5px solid #c8291c;border-radius:var(--border-radius-lg);overflow:hidden;margin-top:14px}
.ai-agent-header{display:flex;align-items:center;gap:7px;padding:10px 12px;background:#c8291c}
.ai-agent-label{font-size:12px;font-weight:500;color:#fff}
.ai-agent-body{padding:10px 12px 12px}
.ai-agent-sub{font-size:11px;color:var(--color-text-tertiary);margin-bottom:8px;line-height:1.4}
.ai-agent-textarea{width:100%;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:9px 12px;font-size:12px;font-family:var(--font-sans);color:var(--color-text-primary);background:var(--color-background-primary);resize:none;line-height:1.5;height:56px}
.ai-agent-textarea:focus{outline:none;border-color:#c8291c}
.ai-agent-row{display:flex;justify-content:flex-end;margin-top:8px}
.ai-agent-send{background:#c8291c;border:none;border-radius:var(--border-radius-md);padding:7px 16px;font-size:12px;font-weight:500;color:#fff;cursor:pointer;display:flex;align-items:center;gap:5px}
.ai-agent-send:disabled{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);color:var(--color-text-tertiary);cursor:not-allowed}
.spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.applied-edit-chip{display:flex;align-items:flex-start;gap:7px;background:#f0faf6;border:0.5px solid #a8e0c8;border-radius:var(--border-radius-md);padding:7px 10px;margin-top:10px;font-size:11px;color:#136645}
.applied-edit-chip .edit-detail{display:block;font-size:10px;color:#1D9E75;opacity:.85;margin-top:2px}
.btn-confirm{width:100%;background:#c8291c;border:none;border-radius:var(--border-radius-md);padding:12px 0;font-size:13px;font-weight:500;color:#fff;cursor:pointer;margin-top:14px}
.confirm-hint{font-size:10px;color:#c8291c;font-weight:500;text-align:center;margin-top:6px}
.bundle-wrap{padding:14px 20px}
.edits-applied-banner{background:#f0faf6;border:1.5px solid #1D9E75;border-radius:var(--border-radius-md);padding:10px 12px;margin-bottom:14px}
.edits-applied-label{font-size:10px;color:#136645;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.edits-applied-item{font-size:11px;color:#136645;padding:3px 0;display:flex;align-items:flex-start;gap:6px}
.edits-applied-item .edit-detail{display:block;font-size:10px;opacity:.8;margin-top:1px}
.prod-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary);position:relative}
.prod-row:last-of-type{border-bottom:none}
.prod-row.swapped{background:#f0faf6;margin:0 -4px;padding:8px 4px;border-radius:var(--border-radius-md);border-bottom:none;margin-bottom:4px}
.prod-row.excluded{opacity:.35}
.swapped-tag,.excluded-tag{position:absolute;top:6px;right:4px;font-size:8px;color:#fff;padding:2px 7px;border-radius:99px;font-weight:700}
.swapped-tag{background:#1D9E75}
.excluded-tag{background:var(--color-text-tertiary)}
.prod-img{width:36px;height:36px;border-radius:var(--border-radius-md);background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--color-text-tertiary);flex-shrink:0}
.prod-type{font-size:9px;color:var(--color-text-tertiary);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.prod-name{font-size:12px;font-weight:500;color:var(--color-text-primary)}
.prod-sku{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-mono)}
.prod-qty{font-size:10px;color:var(--color-text-secondary);margin-top:1px}
.prod-price{margin-left:auto;font-size:13px;font-weight:500;color:var(--color-text-primary);flex-shrink:0;text-align:right}
.prod-unit{font-size:10px;color:var(--color-text-tertiary);font-weight:400}
.bundle-screen-total{display:flex;justify-content:space-between;align-items:center;padding:12px 0 14px;border-top:0.5px solid var(--color-border-tertiary);margin-top:4px}
.bundle-screen-total-label{font-size:12px;color:var(--color-text-secondary)}
.bundle-screen-total-sub{font-size:10px;color:var(--color-text-tertiary);margin-top:1px}
.bundle-screen-total-price{font-size:22px;font-weight:500;color:var(--color-text-primary)}
.bundle-why{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;margin-top:14px}
.bundle-why-header{padding:10px 14px;background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary)}
.bundle-why-title{font-size:11px;font-weight:600;color:var(--color-text-primary);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.04em}
.bundle-badge{display:inline-block;font-size:9px;padding:2px 7px;border-radius:99px;background:#fff0ef;border:0.5px solid #f09595;color:#993C1D;font-weight:600}
.bundle-why-body{padding:12px 14px}
.bundle-why-para{font-size:12px;color:var(--color-text-secondary);line-height:1.7}
.cta-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.cta-primary{background:#c8291c;border:none;border-radius:var(--border-radius-md);padding:11px 0;font-size:12px;font-weight:500;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.cta-primary:disabled{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);color:var(--color-text-tertiary);cursor:not-allowed}
.cta-empty-note{font-size:10px;color:var(--color-text-tertiary);text-align:center;margin-top:6px}
.cta-outline{background:transparent;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:11px 0;font-size:12px;color:var(--color-text-primary);cursor:pointer}
.cta-outline:hover{background:var(--color-background-secondary)}
.cta-share{background:transparent;border:0.5px solid #534AB7;border-radius:var(--border-radius-md);padding:11px 0;font-size:12px;color:#534AB7;cursor:pointer;font-weight:500;display:flex;align-items:center;justify-content:center;gap:5px}
.cta-share:hover,.cta-share.active{background:#534AB7;color:#fff}
.success-note{font-size:11px;color:var(--color-text-tertiary);text-align:center;margin-top:8px}
.share-panel{border:0.5px solid #534AB7;border-radius:var(--border-radius-lg);overflow:hidden;margin-top:14px;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.share-panel-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#534AB7}
.share-panel-title{font-size:12px;font-weight:600;color:#fff;display:flex;align-items:center;gap:7px}
.share-panel-close{background:rgba(255,255,255,.2);border:none;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:13px;flex-shrink:0}
.share-panel-body{padding:12px 14px}
.share-field{margin-bottom:10px}
.share-label{font-size:11px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.share-input{width:100%;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:8px 10px;font-size:12px;font-family:var(--font-sans);color:var(--color-text-primary);background:var(--color-background-primary)}
.share-textarea{width:100%;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:8px 10px;font-size:11px;font-family:var(--font-sans);color:var(--color-text-secondary);background:var(--color-background-secondary);min-height:90px;resize:none;line-height:1.5}
.share-divider{display:flex;align-items:center;gap:10px;margin:10px 0;color:var(--color-text-tertiary);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.share-divider::before,.share-divider::after{content:'';flex:1;height:0.5px;background:var(--color-border-tertiary)}

var BP_TABLET=[[{type:'Case',icon:'ti-shield',name:'aXtion Bold',sku:'CWA4122MP',unitPrice:89},{type:'Mount',icon:'ti-layout-sidebar',name:'VESA 75 Mount Plate',sku:'CWM408MPA',unitPrice:149},{type:'Accessory',icon:'ti-device-tablet',name:'Screen Protector',sku:'CKX121',unitPrice:29}],[{type:'Case',icon:'ti-shield',name:'aXtion Slim',sku:'CWA4152MH',unitPrice:79},{type:'Mount',icon:'ti-layout-sidebar',name:'Counter Mount Pro',sku:'CWM409MPA',unitPrice:139},{type:'Accessory',icon:'ti-device-tablet',name:'Shoulder Strap II',sku:'CWX202',unitPrice:20}]];

function getSwapCatalog(){return isIphone()?SWAP_CATALOG_IPHONE:SWAP_CATALOG_TABLET;}
function getAiHintText(){if(isIphone())return'Tell Claude what to adjust \u2014 try \u201cswap the holster for a shoulder strap\u201d or \u201cswitch to the rugged Extreme case\u201d.';return'Tell Claude what to adjust \u2014 try \u201cswap the mount for a vehicle mount\u201d or \u201cswitch to the slim case\u201d.';}

var DEVICE_GROUPS=[{label:'Apple iPad',icon:'ti-device-ipad',devices:[{id:'ipad_pro_11_m5',name:'iPad Pro 11\u201d (M5)'},{id:'ipad_pro_13_m5',name:'iPad Pro 13\u201d (M5)'},{id:'ipad_pro_11_m4',name:'iPad Pro 11\u201d (M4)'},{id:'ipad_air_11_m4',name:'iPad Air 11\u201d (M4)'},{id:'ipad_air_13_m4',name:'iPad Air 13\u201d (M4)'},{id:'ipad_air_11_m3',name:'iPad Air 11\u201d (M3)'},{id:'ipad_11_a16',name:'iPad 11\u201d (A16)'},{id:'ipad_10_9_10th',name:'iPad 10.9\u201d (10th Gen)'},{id:'ipad_9th_gen',name:'iPad 9th Gen'},{id:'ipad_mini_a17',name:'iPad mini (A17 Pro)'},{id:'ipad_mini_6',name:'iPad mini 6'}]},{label:'Apple iPhone',icon:'ti-device-mobile',devices:[{id:'iphone_17',name:'iPhone 17'},{id:'iphone_16',name:'iPhone 16'},{id:'iphone_15',name:'iPhone 15'}]},{label:'Microsoft Surface',icon:'ti-device-laptop',devices:[{id:'surface_pro_13_12th',name:'Surface Pro 13\u201d (12th Ed)'},{id:'surface_pro_13_11th',name:'Surface Pro 13\u201d (11th Ed)'},{id:'surface_pro_10',name:'Surface Pro 10'},{id:'surface_pro_10_5g',name:'Surface Pro 10 (5G)'},{id:'surface_pro_9',name:'Surface Pro 9'},{id:'surface_pro_12',name:'Surface Pro 12\u201d'},{id:'surface_go_4',name:'Surface Go 4'}]},{label:'Other device',icon:'ti-dots',devices:[{id:'samsung_tab_s9',name:'Samsung Galaxy Tab S9'},{id:'chromebook',name:'Chromebook'},{id:'other_device',name:'Other / not listed'}]}];

var NAV=['Devices','Features','Environment','Review','Bundle'];
var STEP_META=[{q:'Find your device',sub:'Select a category to expand, then tap your model to continue.',pct:0,key:'devices'},{q:'What features matter most?',sub:'',pct:25,key:'features'},{q:'What environment and how are you using your device?',sub:'',pct:50,key:'environment'},{q:'Review your bundle',sub:'',pct:75,key:'review'},{q:'Your recommended bundle',sub:'',pct:100,key:'bundle'}];

function ensureLiveProducts(){if(!liveProducts){var base=getBPOptions()[selectedBundleOption]||getBPOptions()[0];liveProducts=[];for(var i=0;i<base.length;i++)liveProducts.push({type:base[i].type,icon:base[i].icon,name:base[i].name,sku:base[i].sku,unitPrice:base[i].unitPrice});}return liveProducts;}
function calcTotal(){var p=ensureLiveProducts(),t=0;for(var i=0;i<p.length;i++)t+=p[i].unitPrice*qtys[i];return t;}
function calcTotalQty(){var t=0;for(var i=0;i<qtys.length;i++)t+=qtys[i];return t;}
function hasActiveItems(){return calcTotalQty()>0;}
function changeQty(i,d){qtys[i]=Math.max(0,qtys[i]+d);renderStep();}
function buildBC(){var parts=[];if(sel.device)parts.push(sel.device.name);if(sel.features.length)parts.push(sel.features.length+' feature'+(sel.features.length!==1?'s':''));var eq=getEnvQuestions(),ec=Object.keys(sel.scenarios).length;if(ec)parts.push(ec+'/'+eq.length+' answered');if(!parts.length)return'';return parts.map(function(t,i,a){return'<span class="bc-item">'+t+'</span>'+(i<a.length-1?'<span class="bc-sep">\u203a</span>':'');}).join('');}

function buildReasoningParagraph(){
  var deviceName=sel.device?sel.device.name:'your device',sc=sel.scenarios,family=getDeviceFamily(sel.device?sel.device.id:null);
  var products=ensureLiveProducts(),caseName=products[0]?products[0].name:'the case',sentences=[];
  if(family==='iphone')sentences.push('The '+caseName+' is precision-fit for the '+deviceName+', maintaining full button, port, and MagSafe access throughout the work day.');
  else if(family==='surface')sentences.push('The '+caseName+' is engineered specifically for the '+deviceName+', preserving keyboard connector access and Surface Pen compatibility.');
  else sentences.push('The '+caseName+' is precision-built for the '+deviceName+', preserving full Apple Pencil and Smart Connector access.');
  var featLabels={ip_rating:'IP68 waterproof protection',mil_rating:'MIL-STD-810H drop rating',screen_protector:'integrated screen protection',reinforced_corners:'reinforced corner cushioning',chemical_resistant:'chemical resistance',thermo_defend:'ThermoDefend thermal insulation',vesa_compatible:'VESA mount compatibility',magconnect:'MagConnect quick-attach capability',magsafe:'MagSafe pass-through charging',shoulder_strap:'shoulder strap anchors',hand_strap:'an adjustable hand strap',kick_stand:'a built-in kickstand',pencil_holder:'a pencil holder slot',asset_tag:'an asset tag window',kensington_lock:'a Kensington lock point'};
  var fp=[];for(var i=0;i<sel.features.length;i++){if(featLabels[sel.features[i]])fp.push(featLabels[sel.features[i]]);}

  else if(fp.length>1)sentences.push('Based on your selections, this bundle delivers '+fp.slice(0,-1).join(', ')+', and '+fp[fp.length-1]+'.');

  var le=sel.appliedEdits.filter(function(e){return e.matched;});if(le.length)sentences.push('Your requested adjustment (\u201c'+le[le.length-1].text+'\u201d) has been applied: '+le[le.length-1].detail+'.');
  return sentences.join(' ');
}

}

  var html='<div class="card-body">';
  if(sel.certified===null){html+='<div class="gate-block"><div class="gate-q">Do you need a certified rugged case (hazardous location rated)?</div><div class="gate-opts"><div class="gate-opt" onclick="pickCertified(\'yes\')"><div class="gate-icon"><i class="ti ti-alert-triangle"></i></div><div><div class="gate-text">Yes, I need certified</div><div class="gate-sub">Class I/II Division 2 hazardous locations</div></div></div><div class="gate-opt" onclick="pickCertified(\'no\')"><div class="gate-icon"><i class="ti ti-check"></i></div><div><div class="gate-text">No, standard case is fine</div><div class="gate-sub">Continue to feature selection</div></div></div></div></div>';}
  if(sel.certified==='no'){var fl=getDeviceFamilyLabel(),feats=getFilteredFeatures2();html+='<div class="certified-change"><i class="ti ti-shield-check" style="font-size:11px;color:var(--color-text-tertiary)"></i>Standard case selected. <a onclick="changeCertified()">Change</a></div><div class="device-filter-note"><i class="ti ti-filter" style="font-size:12px"></i>Showing features available for <strong>'+fl+'</strong> cases only</div><div class="feat-section-label">Select features that matter to you</div><div class="feat-table">';for(var f=0;f<feats.length;f++){var feat=feats[f],isSel=sel.features.indexOf(feat.id)>-1;html+='<div class="feat-row'+(isSel?' selected':'')+'" onclick="toggleFeature(\''+feat.id+'\')"><div class="feat-check">'+(isSel?'<i class="ti ti-check"></i>':'')+'</div><div class="feat-title">'+feat.title+'</div><div class="feat-desc">'+feat.desc+'</div></div>';}html+='</div><div class="logic-note">Features filtered to '+fl+'-compatible options from the aXtion product line comparison chart.</div>';}
  if(sel.certified==='yes'){html+='<div class="certified-change"><i class="ti ti-alert-triangle" style="font-size:11px;color:#c8291c"></i>Certified case selected. <a onclick="changeCertified()">Change</a></div><div class="logic-note">You will be routed directly to our sales team \u2014 certified cases require a compatibility check.</div>';}
  html+='</div>';return html;
}

function renderContactSales(){

  var showBundle=(contactSource==='escalation'||contactSource==='manual');
  if(contactSource==='escalation'){html+='<div class="contact-escalation-banner"><div class="contact-escalation-label"><i class="ti ti-alert-circle" style="font-size:11px"></i>Your request needs a specialist</div>Our AI couldn\u2019t find an exact match for your request. A Joy Factory sales rep will review your bundle and get back to you with the right product.<div class="contact-escalation-request">\u201c'+escalationRequest+'\u201d</div></div>';}
  else if(contactSource==='certified'){html+='<div class="contact-banner"><i class="ti ti-shield" style="margin-right:6px;color:#c8291c"></i>Certified cases require a compatibility check. A specialist will confirm the right product for your device and environment.</div>';}
  else{html+='<div class="contact-banner"><i class="ti ti-info-circle" style="margin-right:5px"></i>A Joy Factory representative will be in touch to help complete your order.</div>';}
  html+='<div class="contact-device-chip"><div class="contact-device-label">Device</div>'+(sel.device?sel.device.name:'\u2014')+'</div>';
  // Always show full recommended bundle when one exists — includes zeroed items so sales has complete context.

  if(showBundle&&liveProducts){
    var products=ensureLiveProducts(),total=calcTotal();

    html+='<div class="contact-bundle-summary">';
    html+='<div class="contact-bundle-label">Recommended bundle'+(hasZeroed?' \u2014 <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#c8291c">some items excluded by user</span>':'')+'</div>';
    for(var i=0;i<products.length;i++){
      var p=products[i],excluded=qtys[i]===0;
      html+='<div class="contact-bundle-item" style="'+(excluded?'opacity:.5':'')+'">';
      html+='<span>'+p.type+': '+p.name+(excluded?' <em style="font-style:italic;font-size:10px">(excluded)</em>':'')+'</span>';
      html+='<span>'+p.sku+(excluded?' \u00d7\u20130':' \u00d7'+qtys[i])+'</span>';
      html+='</div>';
    }
    html+='<div class="contact-bundle-total"><span>Bundle sub-total'+(hasZeroed?' (active items only)':'')+'</span><span>$'+total.toFixed(2)+'</span></div>';
    html+='</div>';
  }
  html+='<div class="contact-field"><div class="contact-label">Full name</div><input class="contact-input" placeholder="Jane Smith"></div><div class="contact-field"><div class="contact-label">Work email</div><input class="contact-input" placeholder="jane@company.com"></div><div class="contact-field"><div class="contact-label">Company</div><input class="contact-input" placeholder="Company name"></div>';
  if(contactSource==='certified'){html+='<div class="contact-field"><div class="contact-label">Certification needed (optional)</div><input class="contact-input" placeholder="e.g. Class I Division 2"></div>';}

  html+='<button class="btn-submit-contact"><i class="ti ti-send" style="font-size:13px;margin-right:6px;vertical-align:-1px"></i>Submit to sales team</button></div>';
  return html;
}

function renderStep(){
  var m=STEP_META[step];
  document.getElementById('progFill').style.width=m.pct+'%';
  document.getElementById('stepLabel').textContent='Step '+(step+1)+' of '+STEP_META.length;
  document.getElementById('stepPct').textContent=m.pct+'% complete';
  document.getElementById('stepQ').textContent=m.q;
  document.getElementById('stepSub').textContent=m.sub||'';
  var bc=document.getElementById('breadcrumb'),bcH=buildBC();
  bc.style.display=(bcH&&step>0)?'flex':'none';bc.innerHTML=bcH;
  document.getElementById('btnBack').disabled=(step===0);

  if(m.key==='devices'){
    document.getElementById('navRow').style.display='none';
    var html='<div class="card-body"><div class="device-table">';
    for(var g=0;g<DEVICE_GROUPS.length;g++){var grp=DEVICE_GROUPS[g],isOpen=accordionOpen[g];html+='<div id="acc-head-'+g+'" class="device-group-head'+(isOpen?' open':'')+'" onclick="toggleAccordion('+g+')"><div class="device-group-left"><i class="ti '+grp.icon+'" style="font-size:13px"></i><span>'+grp.label+'</span><span class="device-group-count">'+grp.devices.length+' device'+(grp.devices.length!==1?'s':'')+'</span></div><i class="ti ti-chevron-down device-group-chevron" id="acc-chev-'+g+'" style="transform:'+(isOpen?'rotate(180deg)':'rotate(0deg)')+';color:'+(isOpen?'#c8291c':'')+'"></i></div><div id="acc-rows-'+g+'" class="device-rows-wrap'+(isOpen?' open':'')+'">';for(var d=0;d<grp.devices.length;d++){var dev=grp.devices[d];html+='<div class="device-row" onclick="pickDevice('+g+','+d+')"><div class="device-icon"><i class="ti '+grp.icon+'"></i></div><div class="device-name">'+dev.name+'</div><i class="ti ti-chevron-right device-arrow"></i></div>';}html+='</div>';}
    html+='</div><div class="logic-note">Tap a category to expand it, then select your device model to continue.</div></div>';
    document.getElementById('stepContent').innerHTML=html;renderNav();return;
  }

  if(m.key==='features'){document.getElementById('navRow').style.display='flex';document.getElementById('btnNext').style.display='';document.getElementById('stepContent').innerHTML=renderFeatures();setNextBtn();renderNav();return;}

  if(m.key==='environment'){
    document.getElementById('navRow').style.display='flex';document.getElementById('btnNext').style.display='';
    var eq=getEnvQuestions(),answered=Object.keys(sel.scenarios).length,iph=isIphone();
    var badgeLabel=iph?'<i class="ti ti-device-mobile" style="font-size:11px"></i> iPhone carry &amp; accessory questions':'<i class="ti ti-device-ipad" style="font-size:11px"></i> Tablet / laptop mount &amp; carry questions';
    var html='<div class="card-body"><div class="env-device-badge">'+badgeLabel+'</div><div class="env-progress">'+answered+' of '+eq.length+' answered</div><div class="env-table">';
    for(var q=0;q<eq.length;q++){var item=eq[q];html+='<div class="env-row"><div class="env-q-wrap"><div class="env-q">'+item.q+'</div><div class="env-q-hint">'+item.hint+'</div></div><div class="env-choices">';for(var c=0;c<item.choices.length;c++){var ch=item.choices[c];html+='<div class="env-choice'+(sel.scenarios[item.key]===ch.id?' selected':'')+'" onclick="pickScenario(\''+item.key+'\',\''+ch.id+'\')">'+ch.label+'</div>';}html+='</div></div>';}
    html+='</div><div class="logic-note">'+(iph?'Mount questions are not shown for iPhone.':'These 7 questions determine which mount and accessories are recommended.')+'</div></div>';
    document.getElementById('stepContent').innerHTML=html;setNextBtn();renderNav();return;
  }

  if(m.key==='review'){
    document.getElementById('navRow').style.display='none';document.getElementById('btnNext').style.display='';
    var total=calcTotal(),tq=calcTotalQty(),bpOpts=getBPOptions(),bundleCount=bpOpts.length,products=ensureLiveProducts();
    var tabsHtml='';
    if(bundleCount>1){tabsHtml='<div class="bundle-tab-row">';for(var i=0;i<bundleCount;i++){var bpCase=bpOpts[i][0];tabsHtml+='<button class="bundle-tab'+(i===selectedBundleOption?' active':'')+'" onclick="changeBundleOption('+i+')">Option '+(i+1)+': '+bpCase.name+'</button>';}tabsHtml+='</div>';}
    var itemsHtml='';
    for(var i=0;i<products.length;i++){var p=products[i],isZero=qtys[i]===0;itemsHtml+='<div class="confirm-item'+(isZero?' zeroed':'')+'"><div class="confirm-item-img"><i class="ti '+p.icon+'"></i></div><div class="confirm-item-info"><div class="confirm-item-type">'+p.type+'</div><div class="confirm-item-name">'+p.name+'</div><div class="confirm-item-sku">'+p.sku+'</div><div class="confirm-item-unit">'+(isZero?'<span style="color:var(--color-text-tertiary);font-style:italic">Excluded from cart</span>':'$'+p.unitPrice.toFixed(2)+' each')+'</div></div><div class="qty-ctrl"><button class="qty-btn" onclick="changeQty('+i+',-1)">\u2212</button><div class="qty-val">'+qtys[i]+'</div><button class="qty-btn" onclick="changeQty('+i+',1)">+</button></div><div class="confirm-item-subtotal" style="'+(isZero?'color:var(--color-text-tertiary)':'')+'">$'+(p.unitPrice*qtys[i]).toFixed(2)+'</div></div>';}
    var editsHtml='';
    if(sel.appliedEdits.length){var matched=sel.appliedEdits.filter(function(e){return e.matched;});if(matched.length){editsHtml='';for(var i=0;i<matched.length;i++){editsHtml+='<div class="applied-edit-chip"><i class="ti ti-check" style="color:#1D9E75;flex-shrink:0;margin-top:1px"></i><span>\u201c'+matched[i].text+'\u201d<span class="edit-detail">'+matched[i].detail+'</span></span></div>';}}}
    var sendDisabled=thinking||!sel.editNote.trim()?'disabled':'';
    var sendContent=thinking?'<i class="ti ti-loader-2 spin"></i> Asking Claude...':'<i class="ti ti-send" style="font-size:12px"></i> Send';
    document.getElementById('stepContent').innerHTML='<div class="review-wrap">'+tabsHtml+'<div class="confirm-section-label">Bundle items \u2014 adjust quantities as needed</div>'+itemsHtml+'<div class="bundle-total-row"><div><div class="bundle-total-label">Bundle sub-total</div><div class="bundle-total-items">'+tq+' item'+(tq!==1?'s':'')+' \u00b7 bundle pricing</div></div><div class="bundle-total-price">$'+total.toFixed(2)+'</div></div><div class="ai-agent-box"><div class="ai-agent-header"><i class="ti ti-sparkles" style="color:#fff;font-size:14px"></i><span class="ai-agent-label">Can our AI Agent assist you with any additional help?</span></div><div class="ai-agent-body"><div class="ai-agent-sub">'+getAiHintText()+'</div><textarea class="ai-agent-textarea" id="aiEditInput" placeholder="Type your request here..." oninput="onEditInput(this.value)"'+(thinking?' disabled':'')+'>'+sel.editNote+'</textarea><div class="ai-agent-row"><button class="ai-agent-send" id="aiEditSendBtn" onclick="applyAiEdit()" '+sendDisabled+'>'+sendContent+'</button></div>'+editsHtml+'</div></div><button class="btn-confirm" onclick="goNext()"><i class="ti ti-check" style="font-size:13px;margin-right:6px;vertical-align:-1px"></i>Confirm and see bundle</button><div class="confirm-hint">Press this button to continue to your final bundle</div></div>';
    renderNav();return;
  }

  if(m.key==='bundle'){
    document.getElementById('navRow').style.display='none';document.getElementById('btnNext').style.display='';
    var total=calcTotal(),tq=calcTotalQty(),products=ensureLiveProducts(),para=buildReasoningParagraph(),active=hasActiveItems();
    var rowsHtml='';
    for(var i=0;i<products.length;i++){var p=products[i],swapped=i===lastChangedIndex&&qtys[i]>0,excluded=qtys[i]===0;var unitLine=qtys[i]>1?'<div class="prod-unit">$'+p.unitPrice.toFixed(2)+' \u00d7 '+qtys[i]+'</div>':'';rowsHtml+='<div class="prod-row'+(swapped?' swapped':'')+(excluded?' excluded':'')+'">'+(swapped?'<div class="swapped-tag">UPDATED</div>':'')+(excluded?'<div class="excluded-tag">NOT IN CART</div>':'')+'<div class="prod-img"><i class="ti '+p.icon+'"></i></div><div style="flex:1;min-width:0"><div class="prod-type">'+p.type+'</div><div class="prod-name">'+p.name+'</div><div class="prod-sku">'+p.sku+'</div><div class="prod-qty">'+(excluded?'<em style="color:var(--color-text-tertiary)">Excluded</em>':'Qty: '+qtys[i])+'</div></div><div class="prod-price" style="'+(excluded?'color:var(--color-text-tertiary)':'')+'">$'+(p.unitPrice*qtys[i]).toFixed(2)+unitLine+'</div></div>';}
    var bannerHtml='';
    if(sel.appliedEdits.filter(function(e){return e.matched;}).length){bannerHtml='<div class="edits-applied-banner"><div class="edits-applied-label"><i class="ti ti-sparkles"></i>Your requested changes were applied</div>';for(var i=0;i<sel.appliedEdits.length;i++){var e=sel.appliedEdits[i];if(e.matched)bannerHtml+='<div class="edits-applied-item"><i class="ti ti-check"></i><span>\u201c'+e.text+'\u201d<span class="edit-detail">'+e.detail+'</span></span></div>';}bannerHtml+='</div>';}
    var sharePanelHtml='';
    if(shareOpen){var msg=buildShareMsg();sharePanelHtml='<div class="share-panel" id="sharePanel"><div class="share-panel-header"><div class="share-panel-title"><i class="ti ti-share"></i>Share this bundle</div><button class="share-panel-close" onclick="closeSharePanel()">&#x2715;</button></div><div class="share-panel-body"><div class="share-field"><div class="share-label">To \u2014 email addresses (comma separated)</div><input class="share-input" placeholder="colleague@company.com, manager@company.com"></div><div class="share-field"><div class="share-label">Message</div><textarea class="share-textarea">'+msg+'</textarea></div><div class="share-divider">or copy a shareable link</div><div class="copy-row"><input class="copy-input" id="shareCopyInput" value="https://configurator.thejoyfactory.com/bundle/demo-12345" readonly><button class="btn-copy" id="shareCopyBtn" onclick="doCopyLink()"><i class="ti ti-copy" style="font-size:12px;margin-right:4px"></i>Copy</button></div></div><div class="share-panel-footer" id="sharePanelFooter"><button class="btn-cancel-share" onclick="closeSharePanel()">Cancel</button><button class="btn-send-email" onclick="doSendShare()"><i class="ti ti-send" style="font-size:12px;margin-right:6px"></i>Send email</button></div><div class="send-success" id="shareSendConfirm"><i class="ti ti-check" style="margin-right:4px"></i>Bundle shared successfully!</div></div>';}
    document.getElementById('stepContent').innerHTML='<div class="bundle-wrap">'+bannerHtml+rowsHtml+
      '<div class="bundle-screen-total"><div><div class="bundle-screen-total-label">Bundle sub-total</div><div class="bundle-screen-total-sub">'+tq+' item'+(tq!==1?'s':'')+' \u00b7 bundle pricing applied</div></div><div class="bundle-screen-total-price">$'+total.toFixed(2)+'</div></div>'+
      '<div class="cta-grid"><button class="cta-primary"'+(active?'':' disabled')+'><i class="ti ti-shopping-cart" style="font-size:13px"></i>Add to cart</button><button class="cta-outline" onclick="goContactSales(\'manual\',\'\')">Contact sales</button><button class="cta-share'+(shareOpen?' active':'')+'" onclick="toggleShare()"><i class="ti ti-share" style="font-size:13px"></i> Share bundle</button></div>'+
      (!active?'<div class="cta-empty-note">Add at least one item to continue to checkout</div>':'')+
      (active?'<p class="success-note">Add to cart routes to BigCommerce checkout \u00b7 Contact Sales creates a HubSpot deal</p>':'')+
      sharePanelHtml+
      '<div class="bundle-why"><div class="bundle-why-header"><div class="bundle-why-title"><i class="ti ti-sparkles" style="color:#c8291c"></i>Why this bundle fits your needs <span class="bundle-badge">Joy AI</span></div></div><div class="bundle-why-body"><p class="bundle-why-para">'+para+'</p></div></div></div>';
    renderNav();return;
  }

  if(m.key==='contact'){document.getElementById('navRow').style.display='flex';document.getElementById('btnNext').style.display='none';document.getElementById('stepContent').innerHTML=renderContactSales();renderNav();return;}
}

function toggleAccordion(g){accordionOpen[g]=!accordionOpen[g];var head=document.getElementById('acc-head-'+g),rows=document.getElementById('acc-rows-'+g),chevron=document.getElementById('acc-chev-'+g);if(!head||!rows||!chevron)return;if(accordionOpen[g]){head.classList.add('open');rows.classList.add('open');chevron.style.transform='rotate(180deg)';chevron.style.color='#c8291c';}else{head.classList.remove('open');rows.classList.remove('open');chevron.style.transform='rotate(0deg)';chevron.style.color='';}}
function changeCertified(){sel.certified=null;sel.features=[];document.getElementById('stepContent').innerHTML=renderFeatures();setNextBtn();}
function pickDevice(g,d){sel.device=DEVICE_GROUPS[g].devices[d];accordionOpen[g]=true;sel.certified=null;sel.features=[];sel.scenarios={};liveProducts=null;selectedBundleOption=0;lastChangedIndex=-1;qtys=[1,1,1];shareOpen=false;escalationRequest='';contactSource='';step=1;renderStep();}
function pickCertified(val){sel.certified=val;if(val==='yes'){goContactSales('certified','');return;}document.getElementById('stepContent').innerHTML=renderFeatures();setNextBtn();}
function toggleFeature(id){var idx=sel.features.indexOf(id);if(idx>-1)sel.features.splice(idx,1);else sel.features.push(id);document.getElementById('stepContent').innerHTML=renderFeatures();setNextBtn();}
function pickScenario(key,val){sel.scenarios[key]=val;renderStep();}
function changeBundleOption(i){selectedBundleOption=i;liveProducts=null;lastChangedIndex=-1;qtys=[1,1,1];renderStep();}
function onEditInput(v){sel.editNote=v;var btn=document.getElementById('aiEditSendBtn');if(btn&&!thinking)btn.disabled=!v.trim();}
function goContactSales(source,requestText){contactSource=source;escalationRequest=requestText||'';shareOpen=false;if(STEP_META[STEP_META.length-1].key!=='contact'){var qLabel=source==='certified'?'Contact our sales team':source==='escalation'?'Connect with a specialist':'Contact sales';STEP_META.push({q:qLabel,sub:'',pct:100,key:'contact'});NAV.push('Contact Sales');}else{STEP_META[STEP_META.length-1].q=source==='escalation'?'Connect with a specialist':'Contact our sales team';}step=STEP_META.length-1;renderStep();}
function interpretEditRequest(text){
  var lower=text.toLowerCase(),products=ensureLiveProducts(),catalog=getSwapCatalog(),targetType=null;
  if(isIphone()){if(lower.indexOf('holster')>-1||lower.indexOf('belt')>-1||lower.indexOf('clip')>-1||lower.indexOf('shoulder')>-1||lower.indexOf('strap')>-1||lower.indexOf('sling')>-1||lower.indexOf('screen')>-1||lower.indexOf('protector')>-1||lower.indexOf('glass')>-1)targetType='Accessory';else if(lower.indexOf('case')>-1||lower.indexOf('extreme')>-1||lower.indexOf('rugged')>-1||lower.indexOf('edge')>-1)targetType='Case';}
  else{if(lower.indexOf('mount')>-1||lower.indexOf('vesa')>-1||lower.indexOf('vehicle')>-1||lower.indexOf('forklift')>-1||lower.indexOf('wall arm')>-1||lower.indexOf('counter')>-1||lower.indexOf('kiosk')>-1)targetType='Mount';else if(lower.indexOf('case')>-1||lower.indexOf('slim')>-1||lower.indexOf('bold')>-1||lower.indexOf('extreme')>-1)targetType='Case';else if(lower.indexOf('shoulder')>-1||lower.indexOf('strap')>-1||lower.indexOf('screen')>-1||lower.indexOf('protector')>-1||lower.indexOf('hand strap')>-1)targetType='Accessory';}
  if(!targetType)return{matched:false};
  var prodIdx=-1;for(var i=0;i<products.length;i++){if(products[i].type===targetType){prodIdx=i;break;}}
  if(prodIdx===-1)return{matched:false};
  var qtyMatch=lower.match(/\b(\d{1,3})\b/),hasQtyLang=/(need|qty|quantity|x\s*\d|of the|units?)/.test(lower);
  if(qtyMatch&&hasQtyLang){var nq=parseInt(qtyMatch[1],10);if(nq>=0&&nq<100){qtys[prodIdx]=nq;lastChangedIndex=prodIdx;return{matched:true,detail:'Quantity for '+products[prodIdx].name+' updated to '+nq,index:prodIdx};}}
  var candidates=catalog[targetType]||[],best=null,bestScore=0;
  for(var c=0;c<candidates.length;c++){var cand=candidates[c],score=0;for(var k=0;k<cand.keywords.length;k++){if(lower.indexOf(cand.keywords[k])>-1)score++;}if(score>bestScore){bestScore=score;best=cand;}}
  if(best&&best.sku!==products[prodIdx].sku){products[prodIdx].name=best.name;products[prodIdx].sku=best.sku;products[prodIdx].unitPrice=best.unitPrice;qtys[prodIdx]=1;lastChangedIndex=prodIdx;return{matched:true,detail:targetType+' updated to '+best.name+' ('+best.sku+')',index:prodIdx};}
  else if(best){return{matched:true,detail:'Your bundle already includes '+best.name,index:prodIdx};}
  return{matched:false};
}
function applyAiEdit(){var note=sel.editNote.trim();if(!note||thinking)return;thinking=true;renderStep();setTimeout(function(){var result=interpretEditRequest(note);thinking=false;if(result.matched){sel.appliedEdits.push({text:note,matched:true,detail:result.detail});sel.editNote='';renderStep();}else{sel.appliedEdits.push({text:note,matched:false});sel.editNote='';goContactSales('escalation',note);}},700);}
function goNext(){if(step<STEP_META.length-1&&isStepValid()){shareOpen=false;step++;renderStep();}}
function goBack(){if(step>0){shareOpen=false;document.getElementById('btnNext').style.display='';if(STEP_META[step].key==='contact'){STEP_META.pop();NAV.pop();var src=contactSource;contactSource='';escalationRequest='';if(src==='certified'){sel.certified=null;step=1;}else{step=Math.min(step-1,STEP_META.length-1);}}else{step--;}renderStep();}}
function resetDemo(){while(STEP_META[STEP_META.length-1].key==='contact'){STEP_META.pop();NAV.pop();}sel={device:null,certified:null,features:[],scenarios:{},editNote:'',appliedEdits:[]};step=0;qtys=[1,1,1];selectedBundleOption=0;liveProducts=null;lastChangedIndex=-1;shareOpen=false;escalationRequest='';contactSource='';accordionOpen={0:false,1:false,2:false,3:false};document.getElementById('btnNext').style.display='';renderStep();}
function toggleShare(){shareOpen=!shareOpen;renderStep();if(shareOpen)setTimeout(function(){var sp=document.getElementById('sharePanel');if(sp)sp.scrollIntoView({behavior:'smooth',block:'nearest'});},50);}
function closeSharePanel(){shareOpen=false;renderStep();}
function doCopyLink(){try{document.getElementById('shareCopyInput').select();document.execCommand('copy');}catch(e){}var btn=document.getElementById('shareCopyBtn');btn.textContent='\u2713 Copied';btn.classList.add('copied');setTimeout(function(){btn.textContent='Copy';btn.classList.remove('copied');},2000);}
function doSendShare(){document.getElementById('sharePanelFooter').style.display='none';document.getElementById('shareSendConfirm').style.display='block';setTimeout(function(){closeSharePanel();},1800);}
renderStep();
</script>
